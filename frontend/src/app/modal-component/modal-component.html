@let modal = modalClasses();

<div [class]="modal" role="dialog" aria-modal="true">
  <div class="modal-background" (click)="close()"></div>
  <div class="modal-content">
    <ng-content />
  </div>
  <button
    class="modal-close is-large"
    type="button"
    aria-label="Close dialog"
    (click)="close()"></button>
</div>
