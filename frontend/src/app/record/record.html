@let record = recordSignal(); @let tooltip = tooltipSignal();

<span class="tooltip" [attr.data-tooltip]="tooltip">
  <span class="number">{{ record.number }}</span>
  <span class="tag is-large">
    <span aria-hidden="true">{{ record.activity.representation }}</span>
    <span class="is-sr-only">{{ record.activity.description }}</span>
    <button
      class="delete"
      type="button"
      [attr.aria-label]="'Remove one ' + record.activity.description"
      (click)="downsert()"></button>
  </span>
</span>
