@let a = activity(); @let e = edition();

<div class="tags has-addons are-large">
  <button
    class="tag is-hoverable"
    type="button"
    [attr.aria-label]="'Record ' + a.description"
    (click)="click()">
    {{ a.representation }}
  </button>
  @if (e) {
  <button
    class="tag is-link is-hoverable"
    type="button"
    [attr.aria-label]="'Edit ' + a.description"
    (click)="edit()">
    <i class="pi pi-pencil" aria-hidden="true"></i>
  </button>
  }
</div>
