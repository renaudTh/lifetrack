@let activities = activitiesSignal();

<app-modal-component [(visible)]="visible">
  <div class="card">
    <div class="card-header">
      <h2 class="card-header-title">{{ dialogTitle() }}</h2>
    </div>
    <div class="card-content">
      <div class="block is-flex is-gap-2 is-flex-wrap-wrap">
        @for (entry of activities | keyvalue; track entry.value.id) {
        <app-activity-component
          [activity]="entry.value"
          [edition]="editMode()"
          (onClick)="upsertActivity($event)"
          (onEdit)="editActivity($event)"></app-activity-component>
        }
      </div>
    </div>
    <footer class="card-footer">
      <button class="card-footer-item" type="button" (click)="onEdit()">
        {{ editButton() }}
      </button>
    </footer>
  </div>
</app-modal-component>
