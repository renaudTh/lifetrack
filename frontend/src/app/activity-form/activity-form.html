@let formGroup = activityForm();

<app-modal-component [(visible)]="visible">
  <div class="card">
    <div class="card-header">
      <h2 class="card-header-title">{{ dialogTitle() }}</h2>
    </div>
    <div class="card-content">
      <form [formGroup]="formGroup" (ngSubmit)="addOrUpdate()">
        <div class="field">
          <label class="label" for="activity-representation">
            Representation
          </label>
          <div class="control">
            <input
              id="activity-representation"
              class="input"
              formControlName="representation"
              type="text"
              placeholder="🚀" />
          </div>
        </div>
        <div class="field">
          <label class="label" for="activity-description">Description</label>
          <div class="control">
            <input
              id="activity-description"
              formControlName="description"
              class="input"
              type="text"
              placeholder="Launch skyrocket" />
          </div>
        </div>
        <div class="field">
          <label class="label" for="activity-amount">Base amount</label>
          <div class="control">
            <input
              id="activity-amount"
              formControlName="base_amount"
              class="input"
              type="number"
              placeholder="1200" />
          </div>
        </div>
        <div class="field">
          <label class="label" for="activity-unit">Unit</label>
          <div class="control">
            <input
              id="activity-unit"
              formControlName="unit"
              class="input"
              type="text"
              placeholder="kph" />
          </div>
        </div>
        <div class="field is-grouped is-grouped-centered">
          <div class="control">
            <button
              class="button is-primary"
              type="submit"
              [disabled]="formGroup.invalid">
              {{ submitLabel() }}
            </button>
          </div>
          @if (displayDelete()) {
          <div class="control">
            <button class="button is-danger" type="button" (click)="delete()">
              Delete
            </button>
          </div>
          }

          <div class="control">
            <button class="button" type="button" (click)="close()">
              Cancel
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</app-modal-component>
