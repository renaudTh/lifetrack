@let user = user$ | async;

<nav class="is-flex is-gap-3 p-5" aria-label="Main">
  <button class="item is-link is-clickable" type="button" (click)="logout()">
    Logout
  </button>
  <a
    class="item is-link"
    routerLink="/"
    routerLinkActive="has-text-weight-bold">
    Home
  </a>
  <a
    class="item is-link"
    routerLink="/stats"
    routerLinkActive="has-text-weight-bold">
    Stats
  </a>
  @if (user) {
  <span class="item">🙋‍♂️ Hi {{ user.name }}</span>
  }
</nav>
