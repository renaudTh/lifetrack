server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker is active in production: a cached index.html references
  # hashed bundles that no longer exist after a deployment.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /ngsw.json {
    add_header Cache-Control "no-store";
  }
}
