server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Le service worker est actif en prod : un index.html en cache reference des bundles
  # hashes qui n'existent plus apres un deploiement.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /ngsw.json {
    add_header Cache-Control "no-store";
  }
}
