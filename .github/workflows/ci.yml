name: CI Pipeline

on:
  # Fires on every push to an open PR targeting main (opened, synchronize,
  # reopened), and on main itself to cover merges.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR cancels the previous run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lifetracklib/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # The library must be installed and built first: backend and frontend
      # consume it through `file:` and compile against its dist.
      - name: Install and build the library
        run: |
          cd lifetracklib
          npm ci
          npm run build

      - name: Install the backend
        run: cd backend && npm ci

      - name: Install the frontend
        run: cd frontend && npm ci

      - name: Check formatting
        run: |
          cd lifetracklib && npm run lint:check
          cd ../backend && npm run lint:check
          cd ../frontend && npm run lint:check

      - name: Lint the backend
        run: cd backend && npm run lint:code

      - name: Build the backend
        run: cd backend && npm run build

      - name: Build the frontend
        run: cd frontend && npm run build

      - name: Test the library
        run: cd lifetracklib && npm test -- --run --coverage

      - name: Test the backend
        run: cd backend && npm test

      - name: Test the frontend
        run: cd frontend && npm test -- --watch=false --browsers=ChromeHeadless

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lifetracklib/coverage
